<main class="landing">
  <mat-card appearance="outlined" class="landing-card">
    <mat-card-header>
      <mat-card-title>YEPPDash</mat-card-title>
      <mat-card-subtitle>Dashboard für YEPPBot</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>
        Melde dich mit deinem Twitch-Account an, um YEPPBot für deinen Kanal zu steuern.
      </p>
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-flat-button [href]="loginUrl">
        <mat-icon>login</mat-icon>
        Login with Twitch
      </a>
    </mat-card-actions>
  </mat-card>
</main>

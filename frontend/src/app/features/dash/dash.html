<main class="dash">
  <mat-card appearance="outlined" class="dash-card">
    <mat-card-header>
      <mat-card-title>Willkommen, {{ auth.currentUser()?.login }}</mat-card-title>
      <mat-card-subtitle>Twitch-ID: {{ auth.currentUser()?.twitchId }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (auth.currentUser()?.email; as email) {
        <p>{{ email }}</p>
      }
      <p class="placeholder-note">
        Channel-Steuerung (Join/Leave) folgt in Phase 2.
      </p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button type="button" (click)="logout()">Abmelden</button>
    </mat-card-actions>
  </mat-card>
</main>

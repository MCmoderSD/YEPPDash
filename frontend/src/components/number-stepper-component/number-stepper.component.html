<button
  type="button"
  tabindex="-1"
  aria-label="Increase"
  [disabled]="atMax()"
  (click)="nudge(1)"
>
  <svg viewBox="0 0 10 6" aria-hidden="true" focusable="false">
    <path d="M1 5 5 1l4 4"/>
  </svg>
</button>

<button
  type="button"
  tabindex="-1"
  aria-label="Decrease"
  [disabled]="atMin()"
  (click)="nudge(-1)"
>
  <svg viewBox="0 0 10 6" aria-hidden="true" focusable="false">
    <path d="M1 1 5 5l4-4"/>
  </svg>
</button>

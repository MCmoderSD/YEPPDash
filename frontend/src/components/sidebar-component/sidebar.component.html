<nav class="sidebar" [class.sidebar-rail]="rail()" appScrollBar aria-label="Dashboard sections">

  <a
    class="sidebar-link sidebar-link-standalone"
    [style.--row]="0"
    [routerLink]="overviewPath"
    routerLinkActive="sidebar-link-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon class="sidebar-link-icon" aria-hidden="true">space_dashboard</mat-icon>
    <span class="sidebar-link-label">Overview</span>
  </a>

  @for (group of groups; track group.id) {
    <section class="sidebar-group">
      <h3 class="sidebar-group-heading">
        <button
          type="button"
          class="sidebar-group-button"
          [style.--row]="headingRow(group)"
          [attr.aria-expanded]="expanded(group)"
          [attr.aria-controls]="'sidebar-group-' + group.id"
          (click)="toggle(group)"
        >
          <mat-icon class="sidebar-group-icon" aria-hidden="true">{{ group.icon }}</mat-icon>
          <span class="sidebar-group-label">{{ group.label }}</span>
          <mat-icon class="sidebar-group-chevron" aria-hidden="true">expand_more</mat-icon>
        </button>
      </h3>

      <div
        class="sidebar-group-items"
        [class.sidebar-group-items-open]="expanded(group)"
        [id]="'sidebar-group-' + group.id"
      >
        <ul class="sidebar-group-list">
          @for (item of group.items; track item.label; let index = $index) {
            <li>
              <a
                class="sidebar-link"
                [style.--row]="itemRow(group, index)"
                [routerLink]="item.path"
                [queryParams]="item.queryParams"
                routerLinkActive="sidebar-link-active"
                [routerLinkActiveOptions]="activeMatch"
                ariaCurrentWhenActive="page"
                (click)="close()"
              >
                @if (item.mask; as mask) {
                  <span
                    class="sidebar-link-icon sidebar-link-icon-mask"
                    [style.--icon]="'url(' + mask + ')'"
                    aria-hidden="true"
                  ></span>
                } @else {
                  <mat-icon class="sidebar-link-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
                }
                <span class="sidebar-link-label">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    </section>
  }
</nav>

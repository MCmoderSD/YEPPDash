<mat-nav-list class="sidebar" aria-label="Dashboard sections">
  <h3 matSubheader>Management</h3>

  <a
    mat-list-item
    [routerLink]="roleManagementPath"
    [queryParams]="{ mode: Mode.Moderator }"
    routerLinkActive="sidebar-entry-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon matListItemIcon aria-hidden="true">shield</mat-icon>
    <span matListItemTitle>Moderator Management</span>
  </a>

  <a
    mat-list-item
    [routerLink]="roleManagementPath"
    [queryParams]="{ mode: Mode.Vip }"
    routerLinkActive="sidebar-entry-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon matListItemIcon aria-hidden="true">star</mat-icon>
    <span matListItemTitle>VIP Management</span>
  </a>

  <a
    mat-list-item
    [routerLink]="quoteManagementPath"
    routerLinkActive="sidebar-entry-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon matListItemIcon aria-hidden="true">format_quote</mat-icon>
    <span matListItemTitle>Quote Management</span>
  </a>

  <a
    mat-list-item
    [routerLink]="commandPath"
    routerLinkActive="sidebar-entry-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon matListItemIcon aria-hidden="true">terminal</mat-icon>
    <span matListItemTitle>Custom Commands</span>
  </a>

  <a
    mat-list-item
    [routerLink]="birthdayListPath"
    routerLinkActive="sidebar-entry-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon matListItemIcon aria-hidden="true">cake</mat-icon>
    <span matListItemTitle>Follower Birthdays</span>
  </a>

  <a
    mat-list-item
    [routerLink]="bdsmPath"
    routerLinkActive="sidebar-entry-active"
    [routerLinkActiveOptions]="activeMatch"
    ariaCurrentWhenActive="page"
    (click)="close()"
  >
    <mat-icon matListItemIcon aria-hidden="true">psychology</mat-icon>
    <span matListItemTitle>BDSM Test</span>
  </a>
</mat-nav-list>

<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="quote-edit" (submit)="$event.preventDefault(); save()">
    <mat-form-field appearance="outline" class="quote-edit-field">
      <mat-label>Quote</mat-label>
      <textarea
        matInput
        #message
        rows="5"
        class="app-scrollbar"
        autocomplete="off"
        [attr.maxlength]="maxLength"
        [value]="text()"
        (input)="edit(message.value)"
      ></textarea>

      <mat-hint>
        <!-- aria-live so the count is announced as it changes rather than only on focus. -->
        <span aria-live="polite">{{ length() }} of {{ maxLength }} characters</span>
      </mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" [disabled]="!canSave()" (click)="save()">
    {{ editing ? 'Save' : 'Add quote' }}
  </button>
</mat-dialog-actions>

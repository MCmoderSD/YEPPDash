<h2 mat-dialog-title>User details</h2>

<mat-dialog-content class="user-info">

  <div class="user-info-identity">
    <img
      class="user-info-avatar"
      [ngSrc]="user.profileImageUrl"
      [width]=128
      [height]=128
      alt=""
    />
    <!-- Its own row: the identity above stacks, so the badges would sit over the name rather than
         in front of it. -->
    <div class="user-info-title">
      <app-user-badges [user]="user" [size]="badgeSize" />

      <p class="user-info-name" [style.--chat-color]="chatColor">{{ user.displayName }}</p>
    </div>
  </div>

  <dl class="user-info-details">

    <div class="user-info-detail">
      <dt class="user-info-label">User ID</dt>
      <dd class="user-info-value">{{ user.id }}</dd>
    </div>

    @if (user.email) {
      <div class="user-info-detail">
        <dt class="user-info-label">Email</dt>
        <dd class="user-info-value">{{ user.email }}</dd>
      </div>
    }

    <!-- Left out entirely rather than shown as unset, matching the email above: a detail this user
         never shared is not worth a row of its own. -->
    @if (birthdayDate(); as date) {
      <div class="user-info-detail">
        <dt class="user-info-label">Birthday</dt>
        <dd class="user-info-value">{{ date | localeDate }}</dd>
      </div>
    }
  </dl>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Close</button>
</mat-dialog-actions>

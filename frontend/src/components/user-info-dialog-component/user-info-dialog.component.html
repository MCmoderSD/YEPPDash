<h2 mat-dialog-title>User details</h2>

<mat-dialog-content class="user-info" #content>

  <app-user-profile [user]="user"/>

  <dl class="user-info-details">

    <div class="user-info-detail">
      <dt class="user-info-label">User ID</dt>
      <dd class="user-info-value">{{ user.id }}</dd>
    </div>

    @if (user.email) {
      <div class="user-info-detail">
        <dt class="user-info-label">Email</dt>
        <dd class="user-info-value">{{ user.email }}</dd>
      </div>
    }

    @if (birthdayDate(); as date) {
      <div class="user-info-detail app-fade-in">
        <dt class="user-info-label">Birthday</dt>
        <dd class="user-info-value">{{ date | localeDate }}</dd>
      </div>
    } @else if (pending()) {
      <div class="user-info-detail user-info-skeleton-birthday app-skeleton-appear" role="status">
        <dt class="user-info-label" aria-hidden="true">Birthday</dt>
        <dd class="user-info-value">
          <span class="app-visually-hidden">Loading their birthday…</span>
          <span class="app-skeleton app-skeleton-bar app-skeleton-text user-info-skeleton-date" aria-hidden="true"></span>
        </dd>
      </div>
    }
  </dl>

  <app-scroll-bar [target]="content"/>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Close</button>
</mat-dialog-actions>

<div class="user-table">

  <mat-form-field appearance="outline" class="user-table-search">
    <mat-label>Search</mat-label>
    <input
      matInput
      #search
      type="search"
      autocomplete="off"
      placeholder="Name or user ID"
      (input)="filter(search.value)"
    />
    <mat-icon matSuffix aria-hidden="true">search</mat-icon>
  </mat-form-field>

  <app-table-frame>
    <table mat-table matSort [dataSource]="dataSource" class="app-data-table">

      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Name</th>
        <td mat-cell *matCellDef="let user">
          <app-user-identity [user]="user"/>
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">User ID</th>
        <td mat-cell *matCellDef="let user" class="user-table-id">{{ user.id }}</td>
      </ng-container>

      <ng-container matColumnDef="remove">
        <th mat-header-cell *matHeaderCellDef scope="col">
          <span class="user-table-hidden-label">Remove</span>
        </th>
        <td mat-cell *matCellDef="let user" class="user-table-actions">
          <button
            mat-icon-button
            type="button"
            [attr.aria-label]="'Remove ' + user.displayName + ' as ' + role()"
            (click)="removeUser($event, user)"
          >
            <mat-icon aria-hidden="true">person_remove</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns()"></tr>
      <tr
        mat-row
        *matRowDef="let user; columns: columns()"
        class="user-table-row"
        [class.app-fade-in]="loaded()"
        (click)="showDetails(user)"
      ></tr>

      <tr class="user-table-empty-row" *matNoDataRow>
        @if (loading()) {
          <td class="user-table-ghost-cell" [attr.colspan]="columns().length" aria-hidden="true">
            <div class="user-table-ghost" [style.grid-template-columns]="ghostColumns()">
              @for (row of ghostRows(); track row) {
                <div class="user-table-ghost-row">
                  <span class="user-table-ghost-column user-table-ghost-identity">
                    <span class="app-skeleton user-table-ghost-avatar"></span>
                    <span class="app-skeleton app-skeleton-bar user-table-ghost-name"></span>
                  </span>
                  @if (showId()) {
                    <span class="user-table-ghost-column">
                      <span class="app-skeleton app-skeleton-bar user-table-ghost-id"></span>
                    </span>
                  }
                  @if (mode() !== 'user') {
                    <span class="user-table-ghost-column"></span>
                  }
                </div>
              }
            </div>
          </td>
        } @else {
          <td class="app-table-empty" [attr.colspan]="columns().length">
            @if (query()) {
              No user matches “{{ query() }}”.
            } @else {
              No users to show.
            }
          </td>
        }
      </tr>
    </table>
  </app-table-frame>
</div>

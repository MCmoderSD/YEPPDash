<header class="navbar">
  <nav class="navbar-inner" aria-label="Main">
    <div class="navbar-start">
      @if (pending()) {
        <span class="navbar-skeleton-toggle app-skeleton-appear" aria-hidden="true">
          <span class="app-skeleton navbar-skeleton-toggle-fill"></span>
        </span>
      } @else if (auth.currentUser()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Toggle dashboard navigation"
          (click)="sidebar.toggle()"
          class="app-fade-in"
        >
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <a class="navbar-brand" routerLink="/">YEPPDash</a>
    </div>

    <div class="navbar-end" [class.navbar-end-authed]="auth.currentUser()">
      @if (faqUrl; as url) {
        <a mat-button class="navbar-faq" [href]="url">
          <mat-icon aria-hidden="true">quiz</mat-icon>
          FAQ
        </a>
      } @else {
        <a mat-button class="navbar-faq" routerLink="/faq">
          <mat-icon aria-hidden="true">quiz</mat-icon>
          FAQ
        </a>
      }

      @if (pending()) {
        <span class="navbar-skeleton-chip app-skeleton-appear" role="status">
          <span class="app-visually-hidden">Checking your Twitch session…</span>
          <span class="app-skeleton navbar-skeleton-chip-avatar" aria-hidden="true"></span>
          <span class="app-skeleton app-skeleton-bar app-skeleton-text navbar-skeleton-chip-name" aria-hidden="true"></span>
        </span>
      } @else if (auth.currentUser(); as user) {
        <app-user-menu [user]="user" class="app-fade-in" />
      } @else {
        <a mat-flat-button [href]="loginUrl" class="app-fade-in">
          <mat-icon aria-hidden="true">login</mat-icon>
          <span>Login<span class="navbar-login-service"> with Twitch</span></span>
        </a>
      }
    </div>
  </nav>
</header>

<header class="navbar">
  <nav class="navbar-inner" aria-label="Main">
    <div class="navbar-start">
      @if (auth.currentUser()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Toggle dashboard navigation"
          (click)="sidebar.toggle()"
        >
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <a class="navbar-brand" routerLink="/">YEPPDash</a>
    </div>

    <div class="navbar-end" [class.navbar-end-authed]="auth.currentUser()">
      @if (faqUrl; as url) {
        <a mat-button class="navbar-faq" [href]="url">
          <mat-icon aria-hidden="true">quiz</mat-icon>
          FAQ
        </a>
      } @else {
        <a mat-button class="navbar-faq" routerLink="/faq">
          <mat-icon aria-hidden="true">quiz</mat-icon>
          FAQ
        </a>
      }

      @if (auth.currentUser(); as user) {
        <app-user-menu [user]="user" />
      } @else {
        <a mat-flat-button [href]="loginUrl">
          <mat-icon aria-hidden="true">login</mat-icon>
          <span>Login<span class="navbar-login-service"> with Twitch</span></span>
        </a>
      }
    </div>
  </nav>
</header>

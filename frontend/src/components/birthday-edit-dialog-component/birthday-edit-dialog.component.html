<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <div class="birthday-edit">
    <mat-form-field appearance="outline" class="birthday-edit-field">
      <mat-label>Date of birth</mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        [value]="initial"
        [min]="earliest"
        [max]="latest"
        (dateInput)="choose($event.value)"
        (dateChange)="choose($event.value)"
      />

      <mat-datepicker-toggle matIconSuffix [for]="picker"/>

      <mat-datepicker #picker startView="multi-year"/>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" [disabled]="!canSave()" (click)="save()">Save</button>
</mat-dialog-actions>

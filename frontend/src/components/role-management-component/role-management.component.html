<section class="role-management">

  <header class="role-management-header">
    <h1 class="role-management-title">{{ title() }}</h1>
    <p class="role-management-count">
      {{ users().length }} {{ roleName() }}{{ users().length === 1 ? '' : 's' }} in your channel
    </p>
  </header>

  <mat-progress-bar
    class="role-management-progress"
    mode="indeterminate"
    [attr.aria-hidden]="!(loading() || busy())"
    [style.visibility]="loading() || busy() ? 'visible' : 'hidden'"
  />

  <app-user-table [users]="users()" [mode]="role()" (remove)="remove($event)"/>
</section>

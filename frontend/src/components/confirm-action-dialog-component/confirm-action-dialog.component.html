<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content class="confirm-action" #content>
  <p class="confirm-action-message">{{ data.message }}</p>

  @if (locked()) {
    <p class="confirm-action-hint" [id]="hintId">
      Available in {{ remaining() }} second{{ remaining() === 1 ? '' : 's' }}.
    </p>
  }

  <span class="confirm-action-status" role="status">
    @if (timed && !locked()) {
      {{ data.confirmLabel ?? 'Confirm' }} is now available.
    }
  </span>

  <app-scroll-bar [target]="content"/>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>

  <button
    mat-flat-button
    type="button"
    class="confirm-action-confirm"
    [disabled]="locked()"
    [attr.aria-describedby]="locked() ? hintId : null"
    (click)="confirm()"
  >
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-action-message">{{ data.message }}</p>

  @if (locked()) {
    <!-- Referenced by the confirm button rather than announced live: a countdown that speaks every
         second talks over everything else the user is trying to hear. -->
    <p class="confirm-action-hint" [id]="hintId">
      Available in {{ remaining() }} second{{ remaining() === 1 ? '' : 's' }}.
    </p>
  }

  <!-- Announced once, when the wait is over. -->
  <span class="confirm-action-status" role="status">
    @if (timed && !locked()) {
      {{ data.confirmLabel ?? 'Confirm' }} is now available.
    }
  </span>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>

  <button
    mat-flat-button
    type="button"
    class="confirm-action-confirm"
    [disabled]="locked()"
    [attr.aria-describedby]="locked() ? hintId : null"
    (click)="confirm()"
  >
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>

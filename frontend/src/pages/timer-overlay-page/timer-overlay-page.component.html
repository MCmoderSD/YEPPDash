<div class="overlay">
  @if (channel()) {
    <p class="overlay-time" [class.overlay-time-paused]="!timer().running" role="timer">
      <app-timer-display [timer]="timer()"/>
    </p>
  } @else {
    <p class="overlay-hint">This link has no channel on it. Copy the overlay link again from the Subathon Timer page.</p>
  }
</div>

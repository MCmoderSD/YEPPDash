<app-overlay-frame [hint]="hint()">
  @if (channel()) {
    <div class="overlay-stack">
      @if (style().label) {
        <p class="overlay-label">{{ style().label }}</p>
      }

      <p class="overlay-time" [class.overlay-time-paused]="!timer().running" role="timer">
        <app-timer-display [timer]="timer()"/>
      </p>
    </div>
  }
</app-overlay-frame>

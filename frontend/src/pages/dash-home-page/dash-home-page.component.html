<div class="dash-home">
  <header class="dash-home-header">
    <p class="dash-home-eyebrow">Dashboard</p>
    <h1 class="dash-home-title">
      @if (user(); as user) {
        Welcome back, <span class="dash-home-name">{{ user.displayName }}</span>
      } @else {
        Welcome back
      }
    </h1>
    <p class="dash-home-subtitle">Everything YEPPBot runs in your channel, in one place.</p>
  </header>

  <div class="dash-home-row">
    <section class="dash-home-section" aria-labelledby="dash-home-broadcast">
      <h2 class="dash-home-section-title" id="dash-home-broadcast">Broadcast</h2>
      <app-broadcast-overview/>
    </section>

    <section class="dash-home-section" aria-labelledby="dash-home-bot">
      <h2 class="dash-home-section-title" id="dash-home-bot">Bot status</h2>
      <app-bot-manage [botUserId]="botUserId"/>
    </section>
  </div>

  @for (group of groups; track group.id) {
    <section class="dash-home-section" [attr.aria-labelledby]="'dash-home-' + group.id">

      <app-card-carousel [items]="group.items" [label]="group.label">
        <h2 class="dash-home-section-title" [id]="'dash-home-' + group.id">
          <mat-icon class="dash-home-section-icon" aria-hidden="true">{{ group.icon }}</mat-icon>
          {{ group.label }}
        </h2>
      </app-card-carousel>
    </section>
  }
</div>

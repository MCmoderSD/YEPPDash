<mat-sidenav-container class="dash-shell" [class.dash-shell-wide]="wide()">

  <mat-sidenav
    class="dash-drawer"
    [mode]="wide() ? 'side' : 'over'"
    [opened]="sidebar.opened()"
    (closed)="sidebar.close()"
  >
    <app-sidebar/>
  </mat-sidenav>

  <mat-sidenav-content class="dash-content">
    <div class="dash-content-inner">
      <router-outlet/>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

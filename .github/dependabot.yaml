version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Backend image — mcr.microsoft.com/dotnet/{sdk,aspnet}
  - package-ecosystem: "docker"
    directory: "/backend/YEPPDash.Api"
    schedule:
      interval: "daily"

  # Frontend image — node:*-alpine
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "daily"

  # Frontend — npm / Angular
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    ignore:
      # Angular's compiler peer-pins the TypeScript minor it supports, so a major
      # bump ahead of Angular breaks the build. It moves when Angular moves.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Must match the node tag in frontend/Dockerfile, not run ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      angular-dependencies:
        patterns:
          - "@angular/*"
      other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"

  # Backend — .NET / NuGet
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "daily"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

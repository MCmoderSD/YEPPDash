version: 2
updates:
  # Backend — .NET / NuGet
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "daily"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  # Frontend — npm / Angular
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    groups:
      angular-dependencies:
        patterns:
          - "@angular/*"
      other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "typescript" # tightly peer-pinned by @angular/build; keep its bumps as their own reviewable PR

  # Dockerfiles (backend + frontend base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"

  # GitHub Actions workflows, once added
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/yeppdash

jobs:
  build:
    name: Build ${{ matrix.service.name }} (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: backend/YEPPDash.Api
          - name: frontend
            context: frontend
        platform:
          - id: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - id: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          platforms: ${{ matrix.platform.id }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.service.name }}
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.service.name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.service.name }}-${{ matrix.platform.slug }}
          path: /tmp/digests/${{ matrix.service.name }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and Tag (${{ matrix.service.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
          - name: frontend
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: docker buildx imagetools create -t ${{ env.IMAGE }}:${{ matrix.service.name }}-latest $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ matrix.service.name }}-latest
services:
  backend:
    build:
      context: ./backend/YEPPDash.Api
    container_name: YEPPDash-Backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DbTarget: ${DB_TARGET:-Dev}
      ConnectionStrings__HelixDev: ${CONNECTIONSTRINGS__HELIXDEV}
      ConnectionStrings__HelixProd: ${CONNECTIONSTRINGS__HELIXPROD}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: YEPPDash-Frontend
    restart: unless-stopped
    ports:
      - "4000:4000"

networks:
  default:
    name: YEPPDash-Network
